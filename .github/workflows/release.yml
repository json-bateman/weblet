name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install templ (pinned to go.mod version)
        run: go install github.com/a-h/templ/cmd/templ@$(go list -m -f '{{.Version}}' github.com/a-h/templ)

      - name: Generate templ files
        run: templ generate

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-X github.com/json-bateman/weblet/web.Version=${{ github.ref_name }}" \
            -o weblet-linux-${{ matrix.goarch }} ./cmd

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: weblet-linux-${{ matrix.goarch }}
